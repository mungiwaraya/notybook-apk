name: Build Notybook Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install NPM Packages
        run: |
          npm install

      - name: Bundle Web Assets to www/
        run: |
          npm run prepare-assets

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          node configure-android.js

      - name: Ensure Executable Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Build Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Notybook.apk
          echo "=================================================="
          echo "🎉 APK Build Successful!"
          ls -lh release-apk/Notybook.apk
          echo "=================================================="

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Notybook-Android-App
          path: release-apk/Notybook.apk
          retention-days: 30

      - name: Publish Direct 1-Click Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Notybook App v1.0.0 (Direct APK)
          body: |
            ## 📱 Notybook Android App Direct Download
            
            Click below to download the latest **Notybook.apk** directly to your phone:
            
            - 🚀 **[Download Notybook.apk](https://github.com/mungiwaraya/notybook-apk/releases/download/v1.0.0/Notybook.apk)**
            
            ### ✨ Features:
            - 🔒 Military-grade AES-256 local encrypted notes.
            - ⚡ 100% Offline with zero internet required.
            - 🎨 12 Luxury Typography Fonts & Dark Theme.
            - 📂 Folder organization, search & export backup.
          files: |
            release-apk/Notybook.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
